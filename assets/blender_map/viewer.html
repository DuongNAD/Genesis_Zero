<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>3D Diorama Ecosystem Map — Trình xem Bản đồ Tương tác</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: radial-gradient(circle at center, #131b2e 0%, #070a12 100%);
      color: #e2e8f0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      overflow: hidden;
      height: 100vh;
      width: 100vw;
    }
    #canvas-container {
      position: absolute;
      inset: 0;
      z-index: 1;
    }
    #canvas-container canvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    /* Floating Header UI */
    .top-bar {
      position: absolute;
      top: 16px;
      left: 16px;
      right: 16px;
      z-index: 10;
      display: flex;
      justify-content: space-between;
      align-items: center;
      pointer-events: none;
    }
    .brand {
      background: rgba(15, 23, 42, 0.88);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(56, 189, 248, 0.25);
      border-radius: 12px;
      padding: 10px 18px;
      pointer-events: auto;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
    }
    .brand h1 {
      font-size: 1.1rem;
      font-weight: 800;
      letter-spacing: .05em;
      color: #38bdf8;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .brand p {
      font-size: 0.75rem;
      color: #94a3b8;
      margin-top: 2px;
    }

    /* Floating Controls Panel */
    .controls-panel {
      position: absolute;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 10;
      display: flex;
      gap: 10px;
      background: rgba(15, 23, 42, 0.88);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 14px;
      padding: 8px 14px;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
    }
    .btn {
      background: #1e293b;
      color: #f8fafc;
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 8px;
      padding: 8px 14px;
      font-size: 0.82rem;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s ease;
    }
    .btn:hover {
      background: #334155;
      border-color: #38bdf8;
      color: #38bdf8;
      transform: translateY(-1px);
    }
    .btn.active {
      background: #0284c7;
      border-color: #38bdf8;
      color: #ffffff;
      box-shadow: 0 0 12px rgba(56, 189, 248, 0.4);
    }

    /* Biome Preset Bar */
    .biome-bar {
      position: absolute;
      top: 16px;
      right: 16px;
      z-index: 10;
      display: flex;
      flex-direction: column;
      gap: 6px;
      background: rgba(15, 23, 42, 0.88);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 12px;
      padding: 10px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
    }
    .biome-bar span {
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: .08em;
      color: #64748b;
      font-weight: 700;
      margin-bottom: 2px;
    }

    /* Loading Overlay */
    #loading {
      position: absolute;
      inset: 0;
      background: #070a12;
      z-index: 100;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      transition: opacity 0.5s ease;
    }
    .spinner {
      width: 48px;
      height: 48px;
      border: 4px solid rgba(56, 189, 248, 0.2);
      border-top-color: #38bdf8;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    #loading p {
      color: #94a3b8;
      font-size: 0.9rem;
      font-weight: 600;
    }

    /* Instruction Badge */
    .help-box {
      position: absolute;
      bottom: 20px;
      left: 20px;
      z-index: 10;
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 10px;
      padding: 8px 12px;
      font-size: 0.72rem;
      color: #94a3b8;
      line-height: 1.5;
    }
    .help-box b { color: #f8fafc; }
  </style>
  <script src="/web/vendor/three.min.js"></script>
  <script src="/web/vendor/GLTFLoader.js"></script>
</head>
<body>
  <div id="loading">
    <div class="spinner"></div>
    <p id="load-status">Đang nạp mô hình 3D sinh thái (ecosystem_map.glb)...</p>
  </div>

  <div class="top-bar">
    <div class="brand">
      <h1>🗺️ Bản Đồ Sinh Thái 3D Diorama</h1>
      <p>Blender 5.2.1 LTS · Geological Cutaway · 4 Biomes · 10 Animations</p>
    </div>
  </div>

  <div class="biome-bar">
    <span>Góc Nhìn Sinh Thái</span>
    <button class="btn active" onclick="setCamera('iso', this)">🌐 3/4 Isometric</button>
    <button class="btn" onclick="setCamera('alpine', this)">🏔️ Núi Tuyết Alpine</button>
    <button class="btn" onclick="setCamera('forest', this)">🌲 Rừng Thung Lũng</button>
    <button class="btn" onclick="setCamera('lake', this)">🌊 Hồ Nước & Vịnh</button>
    <button class="btn" onclick="setCamera('cave', this)">🦇 Cửa Hang Karst</button>
  </div>

  <div class="controls-panel">
    <button id="btn-anim" class="btn active" onclick="toggleAnimations()">⏸️ Tạm Dừng Hoạt Ảnh</button>
    <button class="btn" onclick="toggleLighting()">💡 Đổi Ánh Sáng (Ngày/Đêm)</button>
    <button class="btn" onclick="resetView()">🎯 Reset Camera</button>
  </div>

  <div class="help-box">
    <div>🖱️ <b>Chuột trái:</b> Xoay 360° &nbsp;|&nbsp; <b>Chuột phải / Shift:</b> Di chuyển Pan</div>
    <div>⚙️ <b>Cuộn chuột:</b> Thu phóng Zoom &nbsp;|&nbsp; <b>Phím Space:</b> Bật/tắt hoạt ảnh</div>
  </div>

  <div id="canvas-container"></div>

  <script>
    let scene, camera, renderer, clock, mixer;
    let animations = [];
    let isPlaying = true;
    let isNight = false;
    let sunLight, hemiLight, ambientLight;

    let isDragging = false;
    let isPanning = false;
    let prevMouseX = 0, prevMouseY = 0;
    let currentLookAt = new THREE.Vector3(0, 5, 0);
    let spherical = { radius: 180, theta: Math.PI / 4, phi: Math.PI / 3 };

    function init() {
      const container = document.getElementById('canvas-container');
      clock = new THREE.Clock();

      scene = new THREE.Scene();
      scene.background = new THREE.Color('#080d1a');
      scene.fog = new THREE.FogExp2('#080d1a', 0.0018);

      camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 1, 1000);
      updateCameraFromSpherical();

      renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.outputEncoding = THREE.sRGBEncoding;
      renderer.toneMapping = THREE.ACESFilmicToneMapping;
      renderer.toneMappingExposure = 1.1;
      renderer.shadowMap.enabled = true;
      renderer.shadowMap.type = THREE.PCFSoftShadowMap;
      container.appendChild(renderer.domElement);

      hemiLight = new THREE.HemisphereLight(0xdff0ff, 0x1f2937, 0.85);
      scene.add(hemiLight);

      ambientLight = new THREE.AmbientLight(0xffffff, 0.35);
      scene.add(ambientLight);

      sunLight = new THREE.DirectionalLight(0xfff3db, 1.8);
      sunLight.position.set(90, 140, 60);
      sunLight.castShadow = true;
      sunLight.shadow.mapSize.width = 2048;
      sunLight.shadow.mapSize.height = 2048;
      sunLight.shadow.camera.near = 10;
      sunLight.shadow.camera.far = 400;
      const d = 110;
      sunLight.shadow.camera.left = -d;
      sunLight.shadow.camera.right = d;
      sunLight.shadow.camera.top = d;
      sunLight.shadow.camera.bottom = -d;
      scene.add(sunLight);

      setupEvents(container);
      loadModel();
      animate();
    }

    function updateCameraFromSpherical() {
      spherical.phi = Math.max(0.1, Math.min(Math.PI / 2 - 0.05, spherical.phi));
      spherical.radius = Math.max(20, Math.min(450, spherical.radius));

      const x = currentLookAt.x + spherical.radius * Math.sin(spherical.phi) * Math.sin(spherical.theta);
      const y = currentLookAt.y + spherical.radius * Math.cos(spherical.phi);
      const z = currentLookAt.z + spherical.radius * Math.sin(spherical.phi) * Math.cos(spherical.theta);

      camera.position.set(x, y, z);
      camera.lookAt(currentLookAt);
    }

    function setupEvents(el) {
      window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
      });

      el.addEventListener('mousedown', (e) => {
        if (e.button === 2 || e.shiftKey) {
          isPanning = true;
        } else if (e.button === 0) {
          isDragging = true;
        }
        prevMouseX = e.clientX;
        prevMouseY = e.clientY;
      });

      window.addEventListener('mouseup', () => {
        isDragging = false;
        isPanning = false;
      });

      el.addEventListener('contextmenu', (e) => e.preventDefault());

      window.addEventListener('mousemove', (e) => {
        const deltaX = e.clientX - prevMouseX;
        const deltaY = e.clientY - prevMouseY;
        prevMouseX = e.clientX;
        prevMouseY = e.clientY;

        if (isDragging) {
          spherical.theta -= deltaX * 0.007;
          spherical.phi -= deltaY * 0.007;
          updateCameraFromSpherical();
        } else if (isPanning) {
          const right = new THREE.Vector3(1, 0, 0).applyQuaternion(camera.quaternion);
          const up = new THREE.Vector3(0, 1, 0).applyQuaternion(camera.quaternion);
          const factor = spherical.radius * 0.001;
          currentLookAt.addScaledVector(right, -deltaX * factor);
          currentLookAt.addScaledVector(up, deltaY * factor);
          updateCameraFromSpherical();
        }
      });

      el.addEventListener('wheel', (e) => {
        e.preventDefault();
        spherical.radius += e.deltaY * 0.15;
        updateCameraFromSpherical();
      }, { passive: false });

      window.addEventListener('keydown', (e) => {
        if (e.code === 'Space') {
          e.preventDefault();
          toggleAnimations();
        }
      });
    }

    function loadModel() {
      const loader = new THREE.GLTFLoader();
      const glbUrl = 'ecosystem_map.glb';

      loader.load(
        glbUrl,
        (gltf) => {
          const model = gltf.scene;
          model.traverse((child) => {
            if (child.isMesh) {
              child.castShadow = true;
              child.receiveShadow = true;
            }
          });
          scene.add(model);

          if (gltf.animations && gltf.animations.length > 0) {
            mixer = new THREE.AnimationMixer(model);
            gltf.animations.forEach((clip) => {
              const action = mixer.clipAction(clip);
              action.play();
              animations.push(action);
            });
            console.log(`Loaded ${gltf.animations.length} animations!`);
          }

          const loadingEl = document.getElementById('loading');
          loadingEl.style.opacity = '0';
          setTimeout(() => loadingEl.style.display = 'none', 500);
        },
        (xhr) => {
          if (xhr.total > 0) {
            const pct = Math.round((xhr.loaded / xhr.total) * 100);
            document.getElementById('load-status').innerText = `Đang tải bản đồ 3D sinh thái (${pct}%)...`;
          }
        },
        (err) => {
          console.error('Error loading GLB:', err);
          document.getElementById('load-status').innerText = 'Lỗi nạp mô hình.';
        }
      );
    }

    function toggleAnimations() {
      isPlaying = !isPlaying;
      const btn = document.getElementById('btn-anim');
      if (animations.length > 0) {
        animations.forEach((a) => a.paused = !isPlaying);
      }
      if (isPlaying) {
        btn.innerText = '⏸️ Tạm Dừng Hoạt Ảnh';
        btn.classList.add('active');
      } else {
        btn.innerText = '▶️ Tiếp Tục Hoạt Ảnh';
        btn.classList.remove('active');
      }
    }

    function toggleLighting() {
      isNight = !isNight;
      if (isNight) {
        sunLight.intensity = 0.25;
        sunLight.color.setHex(0x38bdf8);
        hemiLight.intensity = 0.3;
        hemiLight.color.setHex(0x1e1b4b);
        scene.background.setHex(0x030712);
        scene.fog.color.setHex(0x030712);
      } else {
        sunLight.intensity = 1.8;
        sunLight.color.setHex(0xfff3db);
        hemiLight.intensity = 0.85;
        hemiLight.color.setHex(0xdff0ff);
        scene.background.setHex(0x080d1a);
        scene.fog.color.setHex(0x080d1a);
      }
    }

    function setCamera(preset, btn) {
      if (btn) {
        document.querySelectorAll('.biome-bar .btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
      }

      if (preset === 'iso') {
        currentLookAt.set(0, 5, 0);
        spherical.radius = 180;
        spherical.theta = Math.PI / 4;
        spherical.phi = Math.PI / 3;
      } else if (preset === 'alpine') {
        currentLookAt.set(10, 18, -40);
        spherical.radius = 80;
        spherical.theta = 0.3;
        spherical.phi = 1.2;
      } else if (preset === 'forest') {
        currentLookAt.set(-30, 8, 20);
        spherical.radius = 90;
        spherical.theta = 1.1;
        spherical.phi = 1.1;
      } else if (preset === 'lake') {
        currentLookAt.set(-10, 5, -10);
        spherical.radius = 85;
        spherical.theta = 2.4;
        spherical.phi = 1.0;
      } else if (preset === 'cave') {
        currentLookAt.set(12, 4, 15);
        spherical.radius = 65;
        spherical.theta = 2.8;
        spherical.phi = 1.35;
      }
      updateCameraFromSpherical();
    }

    function resetView() {
      setCamera('iso', document.querySelector('.biome-bar .btn'));
    }

    function animate() {
      requestAnimationFrame(animate);
      const delta = clock.getDelta();
      if (mixer && isPlaying) {
        mixer.update(delta);
      }
      renderer.render(scene, camera);
    }

    window.onload = init;
  </script>
</body>
</html>
