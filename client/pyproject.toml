[project]
name = "genesis-client"
version = "0.1.0"
description = "Client cho Genesis Zero — thế giới luật ẩn"
requires-python = ">=3.11"
dependencies = ["httpx>=0.27"]

[project.scripts]
genesis-client = "genesis_client:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["genesis_client"]
