services:
  match-server:
    build:
      context: .
      dockerfile: Dockerfile
    image: genesis-zero:latest
    container_name: genesis-match-server
    ports:
      - "8000:8000"
    environment:
      - PYTHONUTF8=1
      - PYTHONIOENCODING=utf-8
      - GENESIS_LLM_URL=http://mock-llm:8099
    volumes:
      - ./data/mesh_cache:/app/data/mesh_cache
      - ./runs:/app/runs
    depends_on:
      - mock-llm
    restart: unless-stopped

  mock-llm:
    build:
      context: .
      dockerfile: Dockerfile
    image: genesis-zero:latest
    container_name: genesis-mock-llm
    command: ["python", "-u", "scripts/fake_model_server.py", "--host", "0.0.0.0", "--port", "8099", "--cheat-seed", "9"]
    ports:
      - "8099:8099"
    environment:
      - PYTHONUTF8=1
      - PYTHONIOENCODING=utf-8
    restart: unless-stopped
