name: CI

'on':
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Stage 1: Lint & Code Quality ──────────────────────────────────────────
  lint:
    name: "Stage 1: Lint (Ruff)"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Run Ruff Linter
        run: uv run ruff check genesis net tests scripts client tools

  # ── Stage 2: Static Type Checking ─────────────────────────────────────────
  typecheck:
    name: "Stage 2: Typecheck (Mypy)"
    runs-on: ubuntu-latest
    needs: [lint]
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Run Mypy Typecheck
        run: uv run mypy genesis net client

  # ── Stage 3: Security & Dependency Audit ──────────────────────────────────
  security:
    name: "Stage 3: Security Audit (uv audit)"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Run Dependency Vulnerability Audit
        run: uv audit

  # ── Stage 4: Cross-Platform & Multi-Python Matrix Testing ─────────────────
  matrix-test:
    name: "Stage 4: Test (${{ matrix.os }} - Py ${{ matrix.python-version }})"
    needs: [lint, typecheck]
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.11", "3.12"]
    runs-on: ${{ matrix.os }}
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Run Quick Offline Release Contracts (<60s)
        run: uv run python scripts/ci_quick.py

      - name: Build packages (for packaging tests)
        run: uv build

      - name: Run Test Suite (pytest)
        run: uv run pytest -q

  # ── Stage 5: Coverage Gate (>=90.0%) ──────────────────────────────────────
  coverage:
    name: "Stage 5: Coverage Gate (>=90.0%)"
    runs-on: ubuntu-latest
    needs: [matrix-test]
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Enforce 90.0% Coverage Threshold
        run: uv run pytest --cov=genesis --cov=net --cov=client --cov-fail-under=90.0

  # ── Stage 6: E2E Smoke Simulation ─────────────────────────────────────────
  smoke:
    name: "Stage 6: Smoke Test (scripts/ci_smoke.py)"
    runs-on: ubuntu-latest
    needs: [matrix-test]
    timeout-minutes: 10
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Run E2E Smoke Simulation
        run: uv run python scripts/ci_smoke.py

  # ── Stage 7: Docker Build Verification ────────────────────────────────────
  docker-build:
    name: "Stage 7: Docker Build & Verification"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: genesis-zero:ci-test
          load: true

      - name: Verify Container Execution & Healthcheck
        run: |
          docker run -d --name test-container -p 8000:8000 genesis-zero:ci-test
          sleep 5
          docker exec test-container curl -f http://localhost:8000/v1/healthz || exit 1
          docker stop test-container
