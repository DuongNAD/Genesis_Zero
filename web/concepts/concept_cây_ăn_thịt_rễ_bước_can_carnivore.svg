<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090e17"/>
      <stop offset="100%" stop-color="#141e33"/>
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22c55e" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0.8"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="600" height="450" rx="14" fill="url(#bg)" stroke="rgba(56, 189, 248, 0.3)" stroke-width="1.5"/>

  <!-- Top Badge -->
  <rect x="25" y="22" width="550" height="42" rx="8" fill="rgba(15, 23, 42, 0.9)" stroke="rgba(255,255,255,0.1)"/>
  <text x="40" y="48" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" fill="#f8fafc">🧬 AGY CONCEPT ART · CÂY ĂN THỊT RỄ BƯỚC</text>
  <text x="560" y="48" font-family="system-ui, sans-serif" font-size="12" fill="#22c55e" text-anchor="end" font-weight="bold">🌿 THỰC VẬT · CAN</text>

  <!-- Center Motif Creature Box -->
  <rect x="25" y="76" width="310" height="260" rx="10" fill="rgba(2, 6, 23, 0.6)" stroke="url(#glow)" stroke-width="1.2" filter="url(#shadow)"/>
  
    <!-- Carnivorous Plant / Treant Silhouette Motif -->
    <g transform="translate(180, 205)">
      <!-- Main Stem & Bark Core -->
      <path d="M-15,65 Q-5,0 0,-45 Q5,0 15,65" fill="#22c55e" opacity="0.85"/>
      <!-- Flower Snap-Trap Head -->
      <ellipse cx="0" cy="-55" rx="35" ry="24" fill="#a855f7" opacity="0.9"/>
      <path d="M-35,-55 Q0,-72 35,-55" stroke="#facc15" stroke-width="3" fill="none"/>
      <!-- Trap Teeth -->
      <polygon points="-25,-55 -20,-42 -15,-55" fill="#f8fafc"/>
      <polygon points="-10,-55 -5,-40 0,-55" fill="#f8fafc"/>
      <polygon points="5,-55 10,-40 15,-55" fill="#f8fafc"/>
      <polygon points="20,-55 25,-42 30,-55" fill="#f8fafc"/>
      <!-- Walking Roots -->
      <path d="M-15,55 Q-45,75 -65,95" stroke="#78350f" stroke-width="10" stroke-linecap="round" fill="none"/>
      <path d="M15,55 Q45,75 65,95" stroke="#78350f" stroke-width="10" stroke-linecap="round" fill="none"/>
      <path d="M-5,60 Q-25,90 -35,100" stroke="#78350f" stroke-width="7" stroke-linecap="round" fill="none"/>
      <path d="M5,60 Q25,90 35,100" stroke="#78350f" stroke-width="7" stroke-linecap="round" fill="none"/>
      <!-- Vine Tendrils -->
      <path d="M-10,-10 Q-60,-20 -75,-60 Q-80,-75 -65,-75" stroke="#22c55e" stroke-width="5" stroke-linecap="round" fill="none"/>
      <path d="M10,-10 Q60,-20 75,-60 Q80,-75 65,-75" stroke="#22c55e" stroke-width="5" stroke-linecap="round" fill="none"/>
      <!-- Bioluminescent Spore Glows -->
      <circle cx="-65" cy="-75" r="4" fill="#facc15"/>
      <circle cx="65" cy="-75" r="4" fill="#facc15"/>
      <circle cx="0" cy="-25" r="6" fill="#facc15" opacity="0.8"/>
    </g>
        
  <text x="180" y="322" font-family="system-ui, sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle" font-style="italic">"Nepenthes Ambulans"</text>

  <!-- Right Attribute Panel -->
  <rect x="350" y="76" width="225" height="260" rx="10" fill="rgba(15, 23, 42, 0.7)" stroke="rgba(255,255,255,0.08)"/>
  <text x="365" y="102" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#38bdf8">THUỘC TÍNH TIẾN HÓA</text>
  
  <text x="365" y="128" font-family="system-ui, sans-serif" font-size="11" fill="#cbd5e1">Dinh dưỡng: <tspan fill="#4ade80" font-weight="bold">CARNIVORE</tspan></text>
  <text x="365" y="150" font-family="system-ui, sans-serif" font-size="11" fill="#cbd5e1">Chiến lược: <tspan fill="#facc15" font-weight="bold">STRAT_K</tspan></text>

  <text x="365" y="180" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#a78bfa">CHỈ SỐ TRAITS (Quỹ 20đ)</text>
  <text x="365" y="202" font-family="monospace" font-size="10" fill="#94a3b8">Brain:  2 | Attack: 4</text>
  <text x="365" y="222" font-family="monospace" font-size="10" fill="#94a3b8">Armor:  3 | Speed:  3</text>
  <text x="365" y="242" font-family="monospace" font-size="10" fill="#94a3b8">Sense:  4 | Stomach:4</text>

  <rect x="365" y="260" width="195" height="60" rx="6" fill="rgba(0,0,0,0.4)"/>
  <text x="375" y="278" font-family="system-ui, sans-serif" font-size="9.5" fill="#22c55e" font-weight="bold">BLENDER 3D + 8 ANIMATIONS:</text>
  <text x="375" y="295" font-family="system-ui, sans-serif" font-size="9" fill="#4ade80">✓ Idle, Alert, Walk, Run</text>
  <text x="375" y="310" font-family="system-ui, sans-serif" font-size="9" fill="#4ade80">✓ Attack, Hurt, Eat, Death</text>

  <!-- Bottom User Prompt Quote -->
  <rect x="25" y="348" width="550" height="78" rx="8" fill="rgba(15, 23, 42, 0.85)" stroke="rgba(56, 189, 248, 0.2)"/>
  <text x="40" y="370" font-family="system-ui, sans-serif" font-size="10.5" font-weight="bold" fill="#38bdf8">MÔ TẢ CỦA BẠN (118/500 KÝ TỰ):</text>
  <text x="40" y="392" font-family="system-ui, sans-serif" font-size="10" fill="#e2e8f0" font-style="italic">"Cây hoa ăn thịt di động, bốn rễ cọc bẩy đất bò trườn, đài hoa răng cưa tiết dịch tiêu hóa, dây leo quất roi gai bảo vệ"</text>
  <text x="40" y="412" font-family="system-ui, sans-serif" font-size="9" fill="#64748b">Hệ thống đã nạp trọn bộ Armature Rigging và 8 Action Clips vào file GLB.</text>
</svg>