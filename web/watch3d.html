<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Genesis Zero · Xem 3D</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #06080f; color: #e2e8f0; font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
         height: 100vh; overflow: hidden; }
  #scene { position: absolute; inset: 0; }
  header { position: absolute; top: 0; left: 0; right: 0; padding: 10px 18px; z-index: 2;
           display: flex; gap: 18px; align-items: center;
           background: linear-gradient(#06080fcc, #06080f00); font-size: .85rem; }
  h1 { font-size: 1rem; color: #38bdf8; letter-spacing: .06em; }
  .val { font-family: ui-monospace, Menlo, monospace; color: #f8fafc; font-weight: 700; }
  .badge { padding: 2px 8px; border-radius: 4px; font-size: .72rem; font-weight: 700;
           background: #475569; }
  .badge.RUNNING { background: #10b981; } .badge.REVEAL { background: #f59e0b; }
  .badge.SEEDING { background: #8b5cf6; }
  #hint { position: absolute; bottom: 12px; left: 18px; z-index: 2; font-size: .72rem;
          color: #64748b; line-height: 1.5; }
  #log { position: absolute; right: 0; top: 44px; bottom: 0; width: 300px; z-index: 2;
         overflow-y: auto; padding: 12px; font-size: .7rem;
         font-family: ui-monospace, Menlo, monospace;
         background: #0b1120cc; border-left: 1px solid #1e293b;
         display: flex; flex-direction: column-reverse; gap: 5px; }
  .ev { padding: 4px 6px; border-radius: 3px; background: #020617; border-left: 3px solid #475569; }
  .ev.SPEAK { border-left-color: #38bdf8; } .ev.LAW_FIRED { border-left-color: #f59e0b; }
  .ev.DEATH { border-left-color: #ef4444; } .ev.EAT { border-left-color: #22c55e; }
</style>
</head>
<body>
<div id="scene"></div>
<header>
  <h1>GENESIS ZERO · 3D</h1>
  <div>Pha <span id="phase" class="badge">—</span></div>
  <div>Lượt <span id="tick" class="val">0</span></div>
  <div>Sống <span id="alive" class="val">0/0</span></div>
  <div>Bản đồ <span id="map" class="val">—</span></div>
</header>
<div id="log"></div>
<div id="hint">
  chuột trái kéo · xoay &nbsp;·&nbsp; lăn · thu phóng &nbsp;·&nbsp; phím <b>G</b> · bật/tắt đồ thị nghe
  <br>Sự kiện luật hiện ra thành một tia sáng — <b>không kèm chữ</b>, vì trước REVEAL thì bạn cũng đang đoán như chúng nó.
</div>
<script src="vendor/three.min.js"></script>
<script src="vendor/GLTFLoader.js"></script>
<script src="watch3d.js"></script>
</body>
</html>
