# Genesis Zero — phiên bản ĐÃ GHIM. Sinh bằng `make lock`.
#
#     pip install -r requirements.lock
#
# ## Vì sao một dự án nhỏ lại cần lock file
#
# Đây KHÔNG phải chuyện đóng gói, nó là chuyện **khoa học**. Kết luận trung tâm
# của kho này (`match = 0.000` trên Qwen 1.5B / 7B / 14B) là một phép đo, và một
# phép đo chỉ có nghĩa nếu chạy lại được. `requirements.txt` ghi `fastapi>=0.115`
# nghĩa là ván chạy năm sau dùng một FastAPI khác, một `httpx` khác — và `httpx`
# nằm ngay trên đường gọi model, chỗ mà hạn chờ và cách gom lỗi quyết định bao
# nhiêu lượt nghĩ bị mất.
#
# Đã có tiền lệ trong chính kho này: một hằng số hạn chờ đúng cho MỘT model làm
# 20/41 lời gọi của Qwen-14B trượt, và đọc vội thì thành "14B không quy nạp
# được". Một bản `httpx` khác có thể làm đúng như thế mà không ai đổi dòng code
# nào.
#
# `requirements.txt` giữ nguyên `>=` cho người chỉ muốn chạy thử. File này dành
# cho lúc **đo**: dựng lại đúng môi trường đã cho ra con số.
